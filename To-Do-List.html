<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="To-Do-List.css">
    <link rel="icon" href="C:\Users\USER\Desktop\To-Do-List\Image\ToDo-List Favicon.jpg" type="image/x-icon">
    <title>My To-Do List</title>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        
      <h1>My To-Do List</h1>
      
      
      <p>Keep track of your daily tasks</p>
    </header>

    <!-- Task Input Form -->
    <form id="todo-form" class="todo-form">
      <div class="input-group">
        <input 
          type="text" 
          id="task-input" 
          placeholder="What needs to be done?" 
          autocomplete="off"
          required
        >
        <button type="submit" id="add-btn">Add Task</button>
      </div>
      
      <div class="options-group">
        <select id="priority-select">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>
        
        <input type="date" id="due-date-input">
      </div>
    </form>

    <!-- Controls & Filters -->
    <div class="controls-bar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed-btn" class="clear-btn">Clear Completed</button>
    </div>

    <!-- Task List -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Footer Stats -->
    <footer class="app-footer">
      <span id="task-count">0 items left</span>
    </footer>
  </div>

  <script src="To-Do-List.js"></script>
</body>
</html>
